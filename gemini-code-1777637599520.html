<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的閃卡 App</title>
    <style>
        :root {
            --primary-color: #4f46e5;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-color: #1f2937;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: var(--primary-color);
            margin-bottom: 10px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* 卡片區域 */
        .card-wrapper {
            perspective: 1000px;
            height: 250px;
        }

        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s;
            cursor: pointer;
            box-shadow: var(--shadow);
            border-radius: 12px;
        }

        .card.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 12px;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }

        .card-front {
            background-color: var(--card-bg);
            color: var(--text-color);
            border: 2px solid var(--primary-color);
        }

        .card-back {
            background-color: var(--primary-color);
            color: #ffffff;
            transform: rotateY(180deg);
        }

        .card-title {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .card-hint {
            font-size: 0.85rem;
            opacity: 0.7;
            margin-top: auto;
        }

        /* 控制區域 */
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #4338ca;
        }

        button:disabled {
            background-color: #9ca3af;
            cursor: not-allowed;
        }

        .delete-btn {
            background-color: #ef4444;
        }
        .delete-btn:hover {
            background-color: #dc2626;
        }

        /* 表單區域 */
        .form-container {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        label {
            font-weight: 500;
        }

        input, textarea {
            padding: 10px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 1rem;
        }

        textarea {
            resize: vertical;
            height: 60px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>我的單字閃卡 🃏</h1>
        
        <div class="card-wrapper">
            <div class="card" id="flashcard" onclick="flipCard()">
                <div class="card-face card-front">
                    <div class="card-title" id="front-text">歡迎使用！</div>
                    <p style="font-size: 0.9rem; color: #6b7280;">點擊卡片以翻轉</p>
                    <div class="card-hint">正面</div>
                </div>
                <div class="card-face card-back">
                    <div class="card-title" id="back-text">加入新卡片來開始吧</div>
                    <div class="card-hint">背面</div>
                </div>
            </div>
        </div>

        <div class="controls">
            <button id="prev-btn" onclick="prevCard()">上一張</button>
            <span id="card-counter">0 / 0</span>
            <button class="delete-btn" id="delete-btn" onclick="deleteCard()">刪除此卡</button>
            <button id="next-btn" onclick="nextCard()">下一張</button>
        </div>

        <div class="form-container">
            <h2>新增一張閃卡</h2>
            <div class="form-group">
                <label for="input-front">正面內容（題目）：</label>
                <input type="text" id="input-front" placeholder="例如：Apple">
            </div>
            <div class="form-group">
                <label for="input-back">背面內容（答案）：</label>
                <textarea id="input-back" placeholder="例如：蘋果"></textarea>
            </div>
            <button onclick="addCard()">新增卡片</button>
        </div>
    </div>

    <script>
        // 預設的閃卡內容
        let cards = [
            { front: "Hello", back: "你好" },
            { front: "Code", back: "程式碼" }
        ];

        let currentCardIndex = 0;

        // 初始化視圖
        function updateView() {
            const cardEl = document.getElementById('flashcard');
            const frontText = document.getElementById('front-text');
            const backText = document.getElementById('back-text');
            const counterEl = document.getElementById('card-counter');
            const deleteBtn = document.getElementById('delete-btn');

            cardEl.classList.remove('flipped');

            if (cards.length === 0) {
                frontText.innerHTML = "目前沒有卡片";
                backText.innerHTML = "請在下方新增卡片";
                counterEl.innerHTML = "0 / 0";
                deleteBtn.disabled = true;
                return;
            }

            deleteBtn.disabled = false;
            frontText.innerHTML = cards[currentCardIndex].front;
            backText.innerHTML = cards[currentCardIndex].back;
            counterEl.innerHTML = `${currentCardIndex + 1} / ${cards.length}`;
        }

        // 翻轉卡片
        function flipCard() {
            if (cards.length === 0) return;
            const card = document.getElementById('flashcard');
            card.classList.toggle('flipped');
        }

        // 下一張
        function nextCard() {
            if (cards.length <= 1) return;
            currentCardIndex = (currentCardIndex + 1) % cards.length;
            updateView();
        }

        // 上一張
        function prevCard() {
            if (cards.length <= 1) return;
            currentCardIndex = (currentCardIndex - 1 + cards.length) % cards.length;
            updateView();
        }

        // 新增卡片
        function addCard() {
            const frontInput = document.getElementById('input-front');
            const backInput = document.getElementById('input-back');

            const frontValue = frontInput.value.trim();
            const backValue = backInput.value.trim();

            if (!frontValue || !backValue) {
                alert("請填寫正面與背面的內容！");
                return;
            }

            cards.push({ front: frontValue, back: backValue });
            
            // 清空輸入框並將索引移動到新增的那張卡
            frontInput.value = "";
            backInput.value = "";
            currentCardIndex = cards.length - 1;
            updateView();
        }

        // 刪除卡片
        function deleteCard() {
            if (cards.length === 0) return;
            cards.splice(currentCardIndex, 1);

            if (currentCardIndex >= cards.length && cards.length > 0) {
                currentCardIndex = cards.length - 1;
            } else if (currentCardIndex > 0) {
                // Keep the current index
            } else {
                currentCardIndex = 0;
            }
            updateView();
        }

        // 初始化執行
        updateView();
    </script>
</body>
</html>
